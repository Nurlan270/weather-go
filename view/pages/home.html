{{ define "content" }}
<section id="page-content">
    <div class="container mt-4">
        <div class="d-flex my-4">
            <form id="search" action="/search" method="GET" class="input-group location-search-input-group me-3">
                <input class="form-control" type="text" name="q" placeholder="Enter location"
                       value="{{if $data := .Old.query}}{{$data}}{{end}}" required>
                <button class="btn btn-outline-secondary btn-sm clear-input-button" type="button"
                        onclick="this.previousElementSibling.value=''">
                    &times;
                </button>
            </form>
            <button class="btn btn-outline-success" type="submit" form="search">Search</button>
        </div>

        <div>
            <div class="row">
                {{ range .Locations }}
                <div class="col-12 col-lg-3 col-md-6 mb-4">
                    <div class="card h-100 position-relative weather-card">
                        <form class="position-absolute weather-card-delete-form" action="/locations/{{ .Name }}"
                              method="POST">
                            <button class="btn-close" aria-label="Delete"></button>
                        </form>
                        <img class="card-img-top img-fluid"
                             src="https://openweathermap.org/img/wn/{{ (index .Weather 0).Icon }}@4x.png"
                             alt="Weather icon">
                        <div class="card-body d-flex flex-column">
                            <h1 class="card-text">{{ .Main.Temp }}°C</h1>
                            <h3 class="card-title">{{ .Name }}, {{ .Sys.Country }}</h3>
                            <p class="card-text mb-1">Feels like <span>{{ .Main.FeelsLike }}</span>°C.
                                <span>{{ (index .Weather 0).Description }}</span>
                            </p>
                            <p class="card-text mb-1">Humidity: {{ .Main.Humidity }}%</p>
                        </div>
                    </div>
                </div>
                {{ else }}
                <p>You didn't add any location yet.</p>
                {{ end }}
            </div>
        </div>
    </div>
</section>
{{ end }}
